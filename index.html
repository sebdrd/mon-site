<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Thomson NEO17 - Wagner Techno</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #0F0;
            font-family: 'Courier New', monospace;
            text-align: center;
            overflow: hidden;
        }
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    .content {
            position: relative;
            z-index: 1;
            padding-top: 100px;
            text-shadow: 0 0 15px #0F0;
        }
        h1 {
            font-size: 50px;
            position: relative;
            animation: glitch 2s infinite;
        }
        h1::before,
        h1::after {
            content: "je suis un dieu!";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        h1::before {
            left: 2px;
            text-shadow: -2px 0 #ff00ff;
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }
        h1::after {
            left: -2px;
            text-shadow: -2px 0 #00ffff;
            animation: glitch-anim2 2s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(42px, 9999px, 44px, 0); }
            5% { clip: rect(12px, 9999px, 60px, 0); }
            10% { clip: rect(40px, 9999px, 66px, 0); }
            15% { clip: rect(87px, 9999px, 65px, 0); }
            20% { clip: rect(2px, 9999px, 96px, 0); }
            25% { clip: rect(95px, 9999px, 53px, 0); }
            30% { clip: rect(75px, 9999px, 10px, 0); }
            100% { clip: rect(16px, 9999px, 91px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            5% { clip: rect(52px, 9999px, 74px, 0); }
            10% { clip: rect(79px, 9999px, 85px, 0); }
            15% { clip: rect(75px, 9999px, 5px, 0); }
            20% { clip: rect(67px, 9999px, 61px, 0); }
            25% { clip: rect(14px, 9999px, 79px, 0); }
            30% { clip: rect(1px, 9999px, 66px, 0); }
            100% { clip: rect(86px, 9999px, 30px, 0); }
        }
        p { font-size: 20px; }
    .hint {
            position: fixed;
            bottom: 20px;
            width: 100%;
            font-size: 14px;
            color: #58a6ff;
        }
    .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,255,0,0.1);
            border: 1px solid #0F0;
            color: #0F0;
            padding: 10px 15px;
            cursor: pointer;
            font-family: monospace;
            z-index: 10;
        }
    .audio-control:hover { background: rgba(0,255,0,0.3); }
    .counter {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,255,0,0.1);
            border: 1px solid #0F0;
            color: #0F0;
            padding: 10px 15px;
            font-family: monospace;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="counter" id="visitorCount">👁️ Visiteurs:...</div>
    <div class="audio-control" id="audioBtn">🎛️ WAGNER TECHNO: OFF</div>
    <div class="content">
        <h1>je suis un dieu!</h1>
        <p>Mon premier site codé sur un Celeron N4020</p>
        <p>8Go de RAM + SSD + VS Code = je peux tout faire</p>
        <p>Chevauchée des Walkyries - Techno Edit</p>
    </div>
    <div class="hint">ESPACE = pluie on/off | M = Wagner on/off | Clique n'importe où pour démarrer</div>
    <!-- WAGNER TECHNO - Ride of the Valkyries Techno Remix libre de droit -->
    <audio id="matrixAudio" loop controls style="position:fixed; top:60px; right:20px; z-index:999;">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
    </audio>
    <script>
        // MATRICE
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        let isRunning = true;
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            for(let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        function animate() {
            if (isRunning) {
                draw();
                requestAnimationFrame(animate);
            }
        }
        animate();
        // WAGNER TECHNO
        const audio = document.getElementById('matrixAudio');
        const audioBtn = document.getElementById('audioBtn');
        let musicOn = false;
        function toggleMusic() {
            if (musicOn) {
                audio.pause();
                audioBtn.textContent = '🎛️ WAGNER TECHNO: OFF';
                musicOn = false;
            } else {
                audio.play().catch(e => console.log('Erreur audio:', e));
                audioBtn.textContent = '🔇 WAGNER TECHNO: ON';
                musicOn = true;
            }
        }
        audioBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMusic();
        });
        // COMPTEUR DE VISITEURS
        fetch('https://api.countapi.xyz/hit/sebdrd-matrix/visits')
        .then(res => res.json())
        .then(res => {
                document.getElementById('visitorCount').textContent = `👁️ Visiteurs: ${res.value}`;
            })
        .catch(() => {
                document.getElementById('visitorCount').textContent = '👁️ Visiteurs: ∞';
            });
        // CONTROLES
        document.addEventListener('keydown', (e) => {
            if(e.code === 'Space') {
                isRunning =!isRunning;
                if(isRunning) animate();
                e.preventDefault();
            }
            if(e.code === 'KeyM') {
                toggleMusic();
            }
        });
        document.addEventListener('click', () => {
            if(!musicOn) toggleMusic();
        }, { once: true });
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
