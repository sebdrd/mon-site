<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX LIBRARY PRO v11.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: #0F0;
            overflow: hidden;
            height: 100vh;
        }
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ghostrider {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            z-index: 2;
            opacity: 0.3;
            filter: drop-shadow(0 0 20px #0F0);
            transition: all 0.1s;
        }
        #ghostrider.fire {
            opacity: 0.8;
            filter: drop-shadow(0 0 40px #F00) brightness(1.5);
        }
        .container {
            position: relative;
            z-index: 3;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .title {
            font-size: 24px;
            text-shadow: 0 0 10px #0F0;
            margin-bottom: 20px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        button {
            background: #000;
            color: #0F0;
            border: 1px solid #0F0;
            padding: 8px 15px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            text-shadow: 0 0 5px #0F0;
            transition: all 0.2s;
        }
        button:hover {
            background: #0F0;
            color: #000;
            box-shadow: 0 0 15px #0F0;
        }
        button.active {
            background: #0F0;
            color: #000;
        }
        #trackSelect {
            background: #000;
            color: #0F0;
            border: 1px solid #0F0;
            padding: 8px;
            font-family: 'Share Tech Mono', monospace;
            flex: 1;
            min-width: 200px;
        }
        .player {
            border: 1px solid #0F0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        #visualizer {
            width: 100%;
            height: 100px;
            border: 1px solid #0F0;
            margin: 10px 0;
        }
        .time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 5px;
        }
        #libraryModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 2px solid #0F0;
            padding: 20px;
            z-index: 10;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 0 30px #0F0;
        }
        #libraryModal.show { display: block; }
        .library-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid #0F0;
            padding-bottom: 10px;
        }
        .library-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #030;
        }
        .library-item:hover { background: #010; }
        .del-btn {
            color: #F00;
            border-color: #F00;
            padding: 2px 8px;
        }
        .del-btn:hover {
            background: #F00;
            color: #000;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <img id="ghostrider" src="ghostrider.jpeg" alt="Ghost Rider">
    
    <div class="container">
        <div class="title">MATRIX LIBRARY PRO v11.1</div>
        
        <div class="controls">
            <button id="playBtn">▶</button>
            <button id="loopBtn">LOOP</button>
            <button id="rndBtn">RND</button>
            <button id="trackBtn">TRACK: SELECT</button>
            <select id="trackSelect"></select>
            <label for="fileInput"><button>[+] ADD MP3</button></label>
            <input type="file" id="fileInput" accept="audio/mp3,audio/mpeg" multiple>
            <button id="libraryBtn">LIBRARY</button>
        </div>
        <div class="player">
            <canvas id="visualizer"></canvas>
            <div class="time">
                <span id="currentTime">00:00</span>
                <span id="duration">00:00</span>
            </div>
        </div>
    </div>
    <div id="libraryModal">
        <div class="library-header">
            <span>LIBRARY</span>
            <button id="closeLibrary">X</button>
        </div>
        <div id="libraryList"></div>
    </div>
    <script>
        // MATRIX RAIN
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}";
        const matrixArray = matrix.split("");
        const fontSize = 10;
        const columns = canvas.width / fontSize;
        const drops = [];
        for(let x = 0; x < columns; x++) drops[x] = 1;
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            for(let i = 0; i < drops.length; i++) {
                const text = matrixArray[Math.floor(Math.random() * matrixArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);
        // AUDIO PLAYER
        let audioContext, analyser, source, dataArray;
        let audio = new Audio();
        let isPlaying = false;
        let isLooping = false;
        let isRandom = false;
        let tracks = [];
        let currentTrack = 0;
        let db;
        const playBtn = document.getElementById('playBtn');
        const loopBtn = document.getElementById('loopBtn');
        const rndBtn = document.getElementById('rndBtn');
        const trackBtn = document.getElementById('trackBtn');
        const trackSelect = document.getElementById('trackSelect');
        const fileInput = document.getElementById('fileInput');
        const libraryBtn = document.getElementById('libraryBtn');
        const libraryModal = document.getElementById('libraryModal');
        const closeLibrary = document.getElementById('closeLibrary');
        const libraryList = document.getElementById('libraryList');
        const visualizer = document.getElementById('visualizer');
        const vCtx = visualizer.getContext('2d');
        const ghostrider = document.getElementById('ghostrider');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
                // INDEXEDDB
        function initDB() {
            const request = indexedDB.open('MatrixLibrary', 1);
            request.onerror = () => console.log('DB error');
            request.onsuccess = (e) => {
                db = e.target.result;
                loadTracks();
            };
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains('tracks')) {
                    db.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true });
                }
            };
        }
        function saveTrack(name, data) {
            const tx = db.transaction(['tracks'], 'readwrite');
            const store = tx.objectStore('tracks');
            store.add({ name: name, data: data });
            tx.oncomplete = () => loadTracks();
        }
        function loadTracks() {
            const tx = db.transaction(['tracks'], 'readonly');
            const store = tx.objectStore('tracks');
            const request = store.getAll();
            request.onsuccess = () => {
                tracks = request.result;
                updateTrackList();
                updateLibrary();
            };
        }
        function deleteTrack(id) {
            const tx = db.transaction(['tracks'], 'readwrite');
            const store = tx.objectStore('tracks');
            store.delete(id);
            tx.oncomplete = () => loadTracks();
        }
        function updateTrackList() {
            trackSelect.innerHTML = '';
            tracks.forEach((track, i) => {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = track.name;
                trackSelect.appendChild(option);
            });
        }
        function updateLibrary() {
            libraryList.innerHTML = '';
            tracks.forEach(track => {
                const div = document.createElement('div');
                div.className = 'library-item';
                div.innerHTML = `<span>${track.name}</span><button class="del-btn" onclick="deleteTrack(${track.id})">DEL</button>`;
                libraryList.appendChild(div);
            });
        }
        // AUDIO SETUP
        function setupAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
        }
        function playTrack(index) {
            if (tracks.length === 0) return;
            setupAudio();
            currentTrack = index;
            const track = tracks[index];
            const blob = new Blob([track.data], { type: 'audio/mpeg' });
            audio.src = URL.createObjectURL(blob);
            audio.play();
            isPlaying = true;
            playBtn.textContent = '⏸';
            trackBtn.textContent = `TRACK: ${track.name}`;
            drawVisualizer();
        }
        function drawVisualizer() {
            if (!isPlaying) return;
            requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);
            vCtx.fillStyle = '#000';
            vCtx.fillRect(0, 0, visualizer.width, visualizer.height);
            const barWidth = (visualizer.width / dataArray.length) * 2.5;
            let barHeight;
            let x = 0;
            let bass = 0;
            for(let i = 0; i < dataArray.length; i++) {
                barHeight = dataArray[i] / 2;
                if (i < 10) bass += dataArray[i];
                vCtx.fillStyle = `rgb(0,${barHeight + 100},0)`;
                vCtx.fillRect(x, visualizer.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
            if (bass / 10 > 180) {
                ghostrider.classList.add('fire');
            } else {
                ghostrider.classList.remove('fire');
            }
            currentTimeEl.textContent = formatTime(audio.currentTime);
            durationEl.textContent = formatTime(audio.duration);
        }
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        // EVENT LISTENERS
        playBtn.onclick = () => {
            if (!isPlaying) {
                if (audio.src) {
                    audio.play();
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                    drawVisualizer();
                } else if (tracks.length > 0) {
                    playTrack(0);
                }
            } else {
                audio.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            }
        };
        loopBtn.onclick = () => {
            isLooping =!isLooping;
            audio.loop = isLooping;
            loopBtn.classList.toggle('active', isLooping);
        };
        rndBtn.onclick = () => {
            isRandom =!isRandom;
            rndBtn.classList.toggle('active', isRandom);
        };
        trackSelect.onchange = (e) => {
            playTrack(parseInt(e.target.value));
        };
        fileInput.onchange = (e) => {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => saveTrack(file.name, ev.target.result);
                reader.readAsArrayBuffer(file);
            });
        };
        libraryBtn.onclick = () => libraryModal.classList.add('show');
        closeLibrary.onclick = () => libraryModal.classList.remove('show');
        audio.onended = () => {
            if (isRandom && tracks.length > 1) {
                let next;
                do { next = Math.floor(Math.random() * tracks.length); } while (next === currentTrack);
                playTrack(next);
            } else if (isLooping) {
                audio.play();
            } else if (currentTrack < tracks.length - 1) {
                playTrack(currentTrack + 1);
            } else {
                isPlaying = false;
                playBtn.textContent = '▶';
            }
        };
        // INIT
        window.addEventListener('load', () => {
            visualizer.width = visualizer.offsetWidth;
            visualizer.height = visualizer.offsetHeight;
            initDB();
        });
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            visualizer.width = visualizer.offsetWidth;
            visualizer.height = visualizer.offsetHeight;
        });
    </script>
</body>
</html>
