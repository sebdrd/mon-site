<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Thomson NEO17 Matrix</title>
    <style>
        body { 
            margin: 0;
            background: #000; 
            color: #0F0; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            overflow: hidden;
        }
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
       .content {
            position: relative;
            z-index: 1;
            padding-top: 100px;
            text-shadow: 0 0 10px #0F0;
        }
        h1 { font-size: 50px; }
        p { font-size: 20px; }
       .hint { 
            position: fixed; 
            bottom: 20px; 
            width: 100%; 
            font-size: 14px; 
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="content">
        <h1>je suis un dieu!</h1>
        <p>Mon premier site codé sur un Celeron N4020</p>
        <p>8Go de RAM + SSD + VS Code = je peux tout faire</p>
        <p>Bienvenue dans la Matrice</p>
    </div>
    <div class="hint">Appuie sur ESPACE pour activer/désactiver la pluie de code</div>
    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        let animationId;
        let isRunning = true;
        
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            
            for(let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        function animate() {
            if (isRunning) {
                draw();
                animationId = requestAnimationFrame(animate);
            }
        }
        
        animate();
        
        // Pause avec Espace
        document.addEventListener('keydown', (e) => {
            if(e.code === 'Space') {
                isRunning =!isRunning;
                if(isRunning) animate();
            }
        });
        
        // Resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
