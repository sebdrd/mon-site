<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Thomson NEO17 Matrix</title>
    <style>
        body { 
            margin: 0;
            background: #000; 
            color: #0F0; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            overflow: hidden;
        }
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
      .content {
            position: relative;
            z-index: 1;
            padding-top: 100px;
            text-shadow: 0 0 15px #0F0;
        }
        h1 { font-size: 50px; }
        p { font-size: 20px; }
      .hint { 
            position: fixed; 
            bottom: 20px; 
            width: 100%; 
            font-size: 14px; 
            color: #58a6ff;
        }
      .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,255,0,0.1);
            border: 1px solid #0F0;
            color: #0F0;
            padding: 10px 15px;
            cursor: pointer;
            font-family: monospace;
        }
      .audio-control:hover {
            background: rgba(0,255,0,0.3);
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div class="audio-control" onclick="toggleMusic()">🔊 MUSIQUE: OFF</div>
    
    <div class="content">
        <h1>je suis un dieu!</h1>
        <p>Mon premier site codé sur un Celeron N4020</p>
        <p>8Go de RAM + SSD + VS Code = je peux tout faire</p>
        <p>Bienvenue dans la Matrice</p>
    </div>
    <div class="hint">ESPACE = pluie on/off | M = musique on/off | Clique n'importe où pour démarrer</div>
    <!-- Audio Matrix theme - version libre de droit -->
    <audio id="matrixAudio" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>
    <script>
        // MATRICE
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        let animationId;
        let isRunning = true;
        
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            for(let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        
        function animate() {
            if (isRunning) {
                draw();
                animationId = requestAnimationFrame(animate);
            }
        }
        animate();
        
        // MUSIQUE
        const audio = document.getElementById('matrixAudio');
        const audioBtn = document.querySelector('.audio-control');
        let musicOn = false;
        
        function toggleMusic() {
            if (musicOn) {
                audio.pause();
                audioBtn.textContent = '🔊 MUSIQUE: OFF';
            } else {
                audio.play();
                audioBtn.textContent = '🔇 MUSIQUE: ON';
            }
            musicOn =!musicOn;
        }
        
        // CONTROLES CLAVIER
        document.addEventListener('keydown', (e) => {
            if(e.code === 'Space') {
                isRunning =!isRunning;
                if(isRunning) animate();
            }
            if(e.code === 'KeyM') {
                toggleMusic();
            }
        });
        
        // Démarrer la musique au premier clic n'importe où
        document.addEventListener('click', () => {
            if(!musicOn) toggleMusic();
        }, { once: true });
        
        // Resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
