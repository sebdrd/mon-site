<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX_TERMINAL.exe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #00ff00;
            font-family: 'VT323', monospace;
            font-size: 20px;
            overflow: hidden;
        }
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
       .terminal {
            position: relative; z-index: 10; padding: 40px; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-shadow: 0 0 10px #00ff00;
        }
       .title { font-size: 48px; margin-bottom: 30px; animation: glitch 2s infinite; }
        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 10px #00ff00; }
            50% { text-shadow: -2px 0 #ff0000, 2px 0 #0000ff, 0 0 10px #00ff00; }
        }
       .button {
            background: #000; border: 2px solid #00ff00; color: #00ff00;
            padding: 15px 30px; font-family: 'VT323', monospace; font-size: 24px;
            cursor: pointer; margin: 10px; text-transform: uppercase;
            box-shadow: 0 0 20px #00ff00; transition: all 0.1s;
        }
       .button:hover { background: #00ff00; color: #000; box-shadow: 0 0 40px #00ff00; }
       .button:active { transform: scale(0.95); }
       .status { margin-top: 30px; font-size: 24px; height: 30px; }
       .timer { margin-top: 10px; font-size: 20px; opacity: 0.8; }
       .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="scanlines"></div>

    <div class="terminal">
        <div class="title">MATRIX_TERMINAL.EXE</div>
        <button class="button" id="playBtn">► WAGNER_TECHNO.EXE</button>
        <div class="status" id="status">SYSTEM READY</div>
        <div class="timer" id="timer">0:00 / 0:00</div>
    </div>

    <audio id="matrixAudio" loop preload="auto">
        <source src="./watermello-sport-techno.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = [];
        for(let x = 0; x < columns; x++) { rainDrops[x] = 1; }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff00';
            ctx.font = fontSize + 'px VT323';
            for(let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if(rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        const audio = document.getElementById('matrixAudio');
        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        audio.volume = 1.0;

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.textContent = '■ STOP_TECHNO.EXE';
                    status.textContent = '► WATERMELLO TECHNO EN COURS...';
                }).catch(e => {
                    status.textContent = 'ERREUR: AUTORISEZ LE SON';
                    console.error(e);
                });
            } else {
                audio.pause();
                playBtn.textContent = '► WAGNER_TECHNO.EXE';
                status.textContent = 'SYSTEM PAUSED';
            }
        });

        audio.addEventListener('timeupdate', () => {
            const cur = formatTime(audio.currentTime);
            const dur = formatTime(audio.duration);
            timer.textContent = `${cur} / ${dur}`;
        });

        audio.addEventListener('loadedmetadata', () => {
            status.textContent = 'AUDIO WATERMELLO CHARGE - READY';
        });

        audio.addEventListener('error', () => {
            status.textContent = 'ERREUR: FICHIER MP3 INTROUVABLE';
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
