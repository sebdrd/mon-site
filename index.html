<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX_LIBRARY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #00ff00;
            font-family: 'VT323', monospace;
            font-size: 20px;
            overflow: hidden;
        }
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

.terminal {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            text-shadow: 0 0 10px #00ff00;
        }

.header-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            white-space: pre;
            font-size: 18px;
            line-height: 1.2;
        }

.title {
            font-size: 48px;
            animation: glitch 2s infinite;
            margin-top: 10px;
        }

      @keyframes glitch {
            0%, 100% { text-shadow: 0 0 10px #00ff00; }
            50% { text-shadow: -2px 0 #ff0000, 2px 0 #0000ff, 0 0 10px #00ff00; }
        }

.player {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: right;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
            width: 420px;
        }

.button {
            background: #000;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 12px 20px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            margin: 5px 0;
            text-transform: uppercase;
            box-shadow: 0 0 20px #00ff00;
            transition: all 0.1s;
            width: 100%;
        }
.button:hover { background: #00ff00; color: #000; box-shadow: 0 0 40px #00ff00; }
.button:active { transform: scale(0.95); }

.track-row {
            display: flex;
            gap: 5px;
            margin: 3px 0;
      }

.playlist-btn {
            font-size: 16px;
            padding: 8px 15px;
            flex: 1;
      }
.playlist-btn.active {
            background: #00ff00;
            color: #000;
      }

.download-btn {
            font-size: 16px;
            padding: 8px 12px;
            width: 50px;
            border: 2px solid #00ff00;
            background: #000;
            color: #00ff00;
            cursor: pointer;
            font-family: 'VT323', monospace;
            box-shadow: 0 0 20px #00ff00;
      }
.download-btn:hover {
            background: #00ff00;
            color: #000;
      }

.status { margin-top: 15px; font-size: 18px; height: 22px; }
.timer { margin-top: 5px; font-size: 16px; opacity: 0.8; }
.track-info { margin-top: 8px; font-size: 16px; color: #00ff00; opacity: 0.9; }

.visualizer {
            width: 100%;
            height: 60px;
            margin: 10px 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 2px;
      }
.bar {
            background: #00ff00;
            width: 8px;
            height: 2px;
            box-shadow: 0 0 5px #00ff00;
            transition: height 0.05s;
      }

.scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="scanlines"></div>

    <div class="terminal">
        <div class="header-top">
╔══════════════════════════════════════════════════╗
║ SEBAS_DRD // THOMSON NEO17 // MATRIX v7.0 ║
║ >> LIBRARY SYSTEM ONLINE << ║
╚══════════════════════════════════════════════════╝
            <div class="title">MATRIX LIBRARY</div>
        </div>

        <div class="player">
            <button class="button" id="playBtn">► START TECHNO</button>

            <div class="track-row">
                <button class="button playlist-btn" data-track="0">01. ROCKOT</button>
                <button class="download-btn" data-file="rockot.mp3">↓</button>
            </div>
            <div class="track-row">
                <button class="button playlist-btn" data-track="1">02. SIGMA MUSICART</button>
                <button class="download-btn" data-file="sigmamusicart.mp3">↓</button>
            </div>
            <div class="track-row">
                <button class="button playlist-btn" data-track="2">03. WATERMELLO</button>
                <button class="download-btn" data-file="watermello.mp3">↓</button>
            </div>

            <div class="visualizer" id="visualizer"></div>

            <div class="track-info" id="trackInfo">TRACK: --</div>
            <div class="status" id="status">SYSTEM READY</div>
            <div class="timer" id="timer">0:00 / 0:00</div>
        </div>
    </div>

    <audio id="matrixAudio" preload="metadata"></audio>

    <script>
        // Matrix rain
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = [];
        for(let x = 0; x < columns; x++) { rainDrops[x] = 1; }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff00';
            ctx.font = fontSize + 'px VT323';
            for(let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if(rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // Player + Playlist + Visualizer + Download
        const audio = document.getElementById('matrixAudio');
        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const trackInfo = document.getElementById('trackInfo');
        const playlistBtns = document.querySelectorAll('.playlist-btn');
        const downloadBtns = document.querySelectorAll('.download-btn');
        const visualizer = document.getElementById('visualizer');

        // PLAYLIST AVEC TES VRAIS FICHIERS GITHUB
        const playlist = [
            { name: 'ROCKOT', file: 'rockot.mp3' },
            { name: 'SIGMA MUSICART', file: 'sigmamusicart.mp3' },
            { name: 'WATERMELLO', file: 'watermello.mp3' }
        ];

        let currentTrack = 0;
        audio.volume = 1.0;
        let audioContext;
        let analyser;
        let source;
        let bars;

        // Create visualizer bars
        for(let i = 0; i < 32; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            visualizer.appendChild(bar);
        }
        bars = document.querySelectorAll('.bar');

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 64;
            }
        }

        function updateVisualizer() {
            if (!analyser) return;
            requestAnimationFrame(updateVisualizer);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            for(let i = 0; i < 32; i++) {
                const height = (dataArray[i] / 255) * 60;
                bars[i].style.height = Math.max(2, height) + 'px';
            }
        }

        function loadTrack(index) {
            currentTrack = index;
            audio.src = playlist[index].file;
            trackInfo.textContent = `TRACK: ${playlist[index].name}`;
            playlistBtns.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            status.textContent = `READY: ${playlist[index].file}`;
        }

        function playPause() {
            initAudioContext();
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.textContent = '■ STOP TECHNO';
                    status.textContent = '► PLAYING...';
                    updateVisualizer();
                }).catch(e => {
                    status.textContent = `PLAY FAIL: CHECK MP3`;
                });
            } else {
                audio.pause();
                playBtn.textContent = '► START TECHNO';
                status.textContent = 'SYSTEM PAUSED';
            }
        }

        playBtn.addEventListener('click', playPause);

        playlistBtns.forEach((btn, index) => {
            btn.addEventListener('click', () => {
                loadTrack(index);
                if (!audio.paused) {
                    audio.play().catch(e => {
                        status.textContent = `SWITCH FAIL: CHECK MP3`;
                    });
                }
            });
        });

        // DOWNLOAD SYSTEM
        downloadBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const file = btn.getAttribute('data-file');
                const link = document.createElement('a');
                link.href = file;
                link.download = file;
                link.click();
                status.textContent = `DOWNLOADING: ${file}`;
                setTimeout(() => {
                    status.textContent = 'READY';
                }, 2000);
            });
        });

        audio.addEventListener('timeupdate', () => {
            const cur = formatTime(audio.currentTime);
            const dur = formatTime(audio.duration);
            timer.textContent = `${cur} / ${dur}`;
        });

        audio.addEventListener('loadeddata', () => {
            status.textContent = 'TRACK LOADED - CLICK START';
        });

        audio.addEventListener('error', () => {
            const err = audio.error;
            let msg = 'UNKNOWN';
            if (err) {
                if (err.code === 1) msg = 'ABORTED';
                if (err.code === 2) msg = 'NETWORK - BAD FILE';
                if (err.code === 3) msg = 'DECODE - REUPLOAD MP3';
                if (err.code === 4) msg = '404 NOT FOUND';
            }
            status.textContent = `ERROR: ${msg}`;
        });

        audio.addEventListener('ended', () => {
            let next = (currentTrack + 1) % playlist.length;
            loadTrack(next);
            audio.play();
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        // Init
        loadTrack(0);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
