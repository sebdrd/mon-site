<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX_LIBRARY_PRO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #00ff00;
            font-family: 'VT323', monospace;
            font-size: 20px;
            overflow: hidden;
        }
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* GHOST RIDER BACKGROUND */
       .ghost-bg {
            position: fixed;
            top: 50%;
            left: 30%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            z-index: 2;
            opacity: 0.15;
            filter: hue-rotate(90deg) brightness(1.5) contrast(1.2);
            mix-blend-mode: screen;
            animation: pulse-ghost 4s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulse-ghost {
            0%, 100% { opacity: 0.1; filter: hue-rotate(90deg) brightness(1.2) contrast(1.2); }
            50% { opacity: 0.25; filter: hue-rotate(90deg) brightness(2) contrast(1.5); }
        }

.terminal {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
        }

.title-top {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 64px;
            text-align: center;
            text-shadow: 0 0 20px #00ff00;
            animation: glitch 2s infinite;
            letter-spacing: 4px;
        }

      @keyframes glitch {
            0%, 100% { text-shadow: 0 0 20px #00ff00; }
            50% { text-shadow: -3px 0 #ff0000, 3px 0 #0000ff, 0 0 20px #00ff00; }
        }

.footer-sig {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            opacity: 0.6;
            text-shadow: 0 0 5px #00ff00;
        }

.player {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: right;
            background: rgba(0,0,0,0.95);
            padding: 20px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
            width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            text-shadow: 0 0 5px #00ff00;
        }

.button {
            background: #000;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 12px 20px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            margin: 5px 0;
            text-transform: uppercase;
            box-shadow: 0 0 20px #00ff00;
            transition: all 0.1s;
            width: 100%;
            text-shadow: 0 0 5px #00ff00;
        }
.button:hover { background: #00ff00; color: #000; box-shadow: 0 0 40px #00ff00; text-shadow: none; }
.button:active { transform: scale(0.95); }
.button.small { font-size: 16px; padding: 8px 12px; width: auto; }

.controls {
            display: flex;
            gap: 5px;
            margin: 10px 0;
      }
.controls.button { flex: 1; }
.controls.button.active { background: #00ff00; color: #000; text-shadow: none; }

.track-row {
            display: flex;
            gap: 5px;
            margin: 3px 0;
            align-items: center;
      }

.cover {
            width: 40px;
            height: 40px;
            border: 1px solid #00ff00;
            background: #001100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 10px #00ff00;
            flex-shrink: 0;
      }

.playlist-btn {
            font-size: 16px;
            padding: 8px 15px;
            flex: 1;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
      }
.playlist-btn.active {
            background: #00ff00;
            color: #000;
            text-shadow: none;
      }

.download-btn {
            font-size: 16px;
            padding: 8px 12px;
            width: 50px;
            border: 2px solid #00ff00;
            background: #000;
            color: #00ff00;
            cursor: pointer;
            font-family: 'VT323', monospace;
            box-shadow: 0 0 20px #00ff00;
            flex-shrink: 0;
      }
.download-btn:hover {
            background: #00ff00;
            color: #000;
            text-shadow: none;
      }

.volume-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            font-size: 16px;
      }

#volume {
            flex: 1;
            height: 8px;
            background: #000;
            border: 1px solid #00ff00;
            outline: none;
            -webkit-appearance: none;
      }
#volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #00ff00;
            cursor: pointer;
            box-shadow: 0 0 10px #00ff00;
      }

.status { margin-top: 15px; font-size: 18px; height: 22px; }
.timer { margin-top: 5px; font-size: 16px; opacity: 0.8; }
.track-info { margin-top: 8px; font-size: 16px; color: #00ff00; opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.visualizer {
            width: 100%;
            height: 60px;
            margin: 10px 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 2px;
      }
.bar {
            background: #00ff00;
            width: 8px;
            height: 2px;
            box-shadow: 0 0 5px #00ff00;
            transition: height 0.05s;
      }

.upload-zone {
            border: 2px dashed #00ff00;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
      }
.upload-zone:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 20px #00ff00;
      }
.upload-zone.dragover {
            background: rgba(0, 255, 0, 0.2);
      }
#fileInput { display: none; }

.scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="scanlines"></div>

    <!-- GHOST RIDER BACKGROUND -->
    <img src="https://muse-media-prod.cdn.gobrainstorm.ai/122197596632450974/1338283630554013469" class="ghost-bg" alt="Ghost Rider">

    <div class="terminal">
        <div class="title-top">MATRIX LIBRARY PRO</div>
        <div class="footer-sig">SEBDRD / MATRIX</div>

        <div class="player">
            <button class="button" id="playBtn">► START TECHNO</button>

            <div class="controls">
                <button class="button small" id="loopBtn">LOOP: OFF</button>
                <button class="button small" id="shuffleBtn">SHUFFLE: OFF</button>
            </div>

            <div class="volume-row">
                <span>VOL:</span>
                <input type="range" id="volume" min="0" max="100" value="100">
                <span id="volDisplay">100%</span>
            </div>

            <div id="playlist"></div>

            <div class="upload-zone" id="uploadZone">
                [+] DROP MP3 HERE OR CLICK TO ADD
                <input type="file" id="fileInput" accept="audio/mpeg" multiple>
            </div>

            <div class="visualizer" id="visualizer"></div>

            <div class="track-info" id="trackInfo">TRACK: --</div>
            <div class="status" id="status">SYSTEM READY</div>
            <div class="timer" id="timer">0:00 / 0:00</div>
        </div>
    </div>

    <audio id="matrixAudio" preload="metadata"></audio>

    <script>
        // Matrix rain
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = [];
        for(let x = 0; x < columns; x++) { rainDrops[x] = 1; }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff00';
            ctx.font = fontSize + 'px VT323';
            for(let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if(rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // Player
        const audio = document.getElementById('matrixAudio');
        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const trackInfo = document.getElementById('trackInfo');
        const visualizer = document.getElementById('visualizer');
        const volumeSlider = document.getElementById('volume');
        const volDisplay = document.getElementById('volDisplay');
        const loopBtn = document.getElementById('loopBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const playlistDiv = document.getElementById('playlist');
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        let playlist = [
            { name: 'ROCKOT', file: 'rockot.mp3', cover: 'R' },
            { name: 'SIGMA MUSICART', file: 'sigmamusicart.mp3', cover: 'S' },
            { name: 'WATERMELLO', file: 'watermello.mp3', cover: 'W' }
        ];

        let currentTrack = 0;
        let isLoop = false;
        let isShuffle = false;
        audio.volume = 1.0;
        let audioContext;
        let analyser;
        let source;
        let bars;

        // Create visualizer bars
        for(let i = 0; i < 32; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            visualizer.appendChild(bar);
        }
        bars = document.querySelectorAll('.bar');

        function renderPlaylist() {
            playlistDiv.innerHTML = '';
            playlist.forEach((track, index) => {
                const row = document.createElement('div');
                row.className = 'track-row';
                row.innerHTML = `
                    <div class="cover">${track.cover}</div>
                    <button class="button playlist-btn" data-track="${index}" title="${track.name}">${String(index+1).padStart(2,'0')}. ${track.name}</button>
                    <button class="download-btn" data-file="${track.file}">↓</button>
                `;
                playlistDiv.appendChild(row);
            });
            attachPlaylistEvents();
        }

        function attachPlaylistEvents() {
            document.querySelectorAll('.playlist-btn').forEach((btn, index) => {
                btn.onclick = () => {
                    loadTrack(index);
                    if (!audio.paused) audio.play();
                };
            });
            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const file = btn.getAttribute('data-file');
                    const link = document.createElement('a');
                    link.href = file;
                    link.download = file;
                    link.click();
                    status.textContent = `DOWNLOADING: ${file}`;
                    setTimeout(() => status.textContent = 'READY', 2000);
                };
            });
        }

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 64;
            }
        }

        function updateVisualizer() {
            if (!analyser) return;
            requestAnimationFrame(updateVisualizer);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            for(let i = 0; i < 32; i++) {
                const height = (dataArray[i] / 255) * 60;
                bars[i].style.height = Math.max(2, height) + 'px';
            }
        }

        function loadTrack(index) {
            currentTrack = index;
            audio.src = playlist[index].file;
            trackInfo.textContent = `TRACK: ${playlist[index].name}`;
            document.querySelectorAll('.playlist-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            status.textContent = `READY: ${playlist[index].file}`;
        }

        function playPause() {
            initAudioContext();
            if (audioContext.state === 'suspended') audioContext.resume();
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.textContent = '■ STOP TECHNO';
                    status.textContent = '► PLAYING...';
                    updateVisualizer();
                }).catch(e => {
                    status.textContent = `PLAY FAIL: CHECK MP3`;
                });
            } else {
                audio.pause();
                playBtn.textContent = '► START TECHNO';
                status.textContent = 'SYSTEM PAUSED';
            }
        }

        function nextTrack() {
            if (isShuffle) {
                let next;
                do { next = Math.floor(Math.random() * playlist.length); }
                while (next === currentTrack && playlist.length > 1);
                loadTrack(next);
            } else {
                let next = (currentTrack + 1) % playlist.length;
                loadTrack(next);
            }
            audio.play();
        }

        playBtn.addEventListener('click', playPause);

        loopBtn.addEventListener('click', () => {
            isLoop =!isLoop;
            audio.loop = isLoop;
            loopBtn.textContent = `LOOP: ${isLoop? 'ON' : 'OFF'}`;
            loopBtn.classList.toggle('active', isLoop);
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle =!isShuffle;
            shuffleBtn.textContent = `SHUFFLE: ${isShuffle? 'ON' : 'OFF'}`;
            shuffleBtn.classList.toggle('active', isShuffle);
        });

        volumeSlider.addEventListener('input', () => {
            audio.volume = volumeSlider.value / 100;
            volDisplay.textContent = volumeSlider.value + '%';
        });

        // Upload system
        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            for (let file of files) {
                if (file.type === 'audio/mpeg') {
                    const url = URL.createObjectURL(file);
                    const name = file.name.replace('.mp3', '').toUpperCase();
                    playlist.push({
                        name: name,
                        file: url,
                        cover: name[0] || '?'
                    });
                    status.textContent = `ADDED: ${name}`;
                }
            }
            renderPlaylist();
            setTimeout(() => status.textContent = 'READY', 2000);
        }

        audio.addEventListener('timeupdate', () => {
            const cur = formatTime(audio.currentTime);
            const dur = formatTime(audio.duration);
            timer.textContent = `${cur} / ${dur}`;
        });

        audio.addEventListener('loadeddata', () => {
            status.textContent = 'TRACK LOADED - CLICK START';
        });

        audio.addEventListener('error', () => {
            const err = audio.error;
            let msg = 'UNKNOWN';
            if (err) {
                if (err.code === 1) msg = 'ABORTED';
                if (err.code === 2) msg = 'NETWORK - BAD FILE';
                if (err.code === 3) msg = 'DECODE - REUPLOAD MP3';
                if (err.code === 4) msg = '404 NOT FOUND';
            }
            status.textContent = `ERROR: ${msg}`;
        });

        audio.addEventListener('ended', () => {
            if (!isLoop) nextTrack();
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        // Init
        renderPlaylist();
        loadTrack(0);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
